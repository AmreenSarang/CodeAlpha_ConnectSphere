
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | ConnectSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .profile-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
        }

        .profile-card h2 {
            text-align: center;
            color: #5b4bc4;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-control {
            padding: 11px;
            border-radius: 8px;
        }

        .btn-save {
            background: #6654d9;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
        }

        .btn-save:hover {
            background: #5140b5;
            color: white;
        }

        .btn-cancel {
            border-radius: 8px;
            padding: 11px;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <h2>Edit Profile</h2>

        <p class="subtitle">
            Update your ConnectSphere account information.
        </p>

        <form method="POST">

            {% csrf_token %}

            {% for field in form %}

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <div class="text-danger small mt-1">
                            {{ error }}
                        </div>
                    {% endfor %}

                </div>

            {% endfor %}

            {% if form.non_field_errors %}
                <div class="alert alert-danger">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <button type="submit" class="btn btn-save w-100">
                Save Changes
            </button>

            <a href="{% url 'accounts:profile' %}"
               class="btn btn-outline-secondary btn-cancel w-100 mt-2">
                Cancel
            </a>

        </form>

    </div>

</body>
</html>
