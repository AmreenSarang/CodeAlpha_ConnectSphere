
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebSocket Test | ConnectSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 650px;">
            <div class="card-body p-4">
                <h2>ConnectSphere Connection Test</h2>
                <p class="text-muted">
                    Test the real-time connection for your meeting room.
                </p>

                <label class="form-label" for="roomCode">Room code</label>
                <input id="roomCode" class="form-control mb-3"
                       placeholder="Paste your meeting room UUID">

                <button id="connectBtn" class="btn btn-primary">
                    Connect
                </button>
                <button id="disconnectBtn" class="btn btn-secondary" disabled>
                    Disconnect
                </button>

                <p class="mt-3">
                    Status: <strong id="status">Disconnected</strong>
                </p>

                <hr>
                <h5>Connection log</h5>
                <pre id="log" class="bg-dark text-light p-3 rounded"
                     style="min-height: 150px; white-space: pre-wrap;"></pre>
            </div>
        </div>
    </div>

    <script>
        let socket = null;

        const statusEl = document.getElementById("status");
        const logEl = document.getElementById("log");
        const connectBtn = document.getElementById("connectBtn");
        const disconnectBtn = document.getElementById("disconnectBtn");

        function log(message) {
            logEl.textContent += message + "\n";
        }

        connectBtn.addEventListener("click", () => {
            const roomCode = document.getElementById("roomCode")
                .value.trim();

            if (!roomCode) {
                alert("Enter a meeting room code first.");
                return;
            }

            if (socket && socket.readyState < WebSocket.CLOSING) {
                socket.close();
            }

            const protocol = location.protocol === "https:" ? "wss:" : "ws:";
            const url = `${protocol}//${location.host}/ws/meetings/${encodeURIComponent(roomCode)}/`;

            log("Connecting to " + url);
            statusEl.textContent = "Connecting...";

            socket = new WebSocket(url);

            socket.onopen = () => {
                statusEl.textContent = "Connected";
                log("WebSocket connected successfully.");
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            };

            socket.onmessage = (event) => {
                log("Received: " + event.data);
            };

            socket.onerror = () => {
                log("WebSocket error. Check the server terminal.");
            };

            socket.onclose = (event) => {
                statusEl.textContent = "Disconnected";
                log("Connection closed. Code: " + event.code);
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            };
        });

        disconnectBtn.addEventListener("click", () => {
            if (socket) {
                socket.close();
            }
        });
    </script>
</body>
</html>
